---
- name: Validate the supported host platform
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Debian'
      - ansible_facts['distribution_major_version'] | int >= 13
      - ansible_facts['architecture'] == 'x86_64'
      - ansible_facts['service_mgr'] == 'systemd'
    fail_msg: This role targets the Debian 13+ x86-64 Beelink with systemd.

- name: Discover existing system services
  ansible.builtin.service_facts:

- name: Install UniFi OS Server when not already installed
  when: "'uosserver.service' not in ansible_facts['services']"
  block:
    - name: Validate the pinned official installer
      ansible.builtin.assert:
        that:
          - unifi_os_server_installer_url is match('^https://fw-download[.]ubnt[.]com/data/unifi-os-server/[^\s]+$')
          - unifi_os_server_installer_sha256 is match('^[a-fA-F0-9]{64}$')
        fail_msg: Set the official Linux x64 installer URL and its SHA-256; see docs/unifi-os-server.md.

    - name: Check that UniFi TCP ports are available
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        state: stopped
        timeout: 1
      loop:
        - 8080
        - "{{ unifi_os_server_web_port }}"
      when: not ansible_check_mode

    - name: Install official installer prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - podman
          - slirp4netns
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Download and verify the official installer
      ansible.builtin.get_url:
        url: "{{ unifi_os_server_installer_url }}"
        dest: "{{ unifi_os_server_installer_path }}"
        checksum: "sha256:{{ unifi_os_server_installer_sha256 | lower }}"
        owner: root
        group: root
        mode: "0700"
      when: not ansible_check_mode

    - name: Run the official UniFi OS Server installer
      ansible.builtin.command:
        argv:
          - "{{ unifi_os_server_installer_path }}"
          - --non-interactive
        stdin: ""
      async: 1200
      poll: 5
      changed_when: true
      when: not ansible_check_mode

- name: Enable and start UniFi OS Server
  ansible.builtin.systemd_service:
    name: uosserver.service
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode or 'uosserver.service' in ansible_facts['services']

- name: Wait for the UniFi OS web interface
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ unifi_os_server_web_port }}"
    timeout: "{{ unifi_os_server_startup_timeout }}"
  when: not ansible_check_mode
