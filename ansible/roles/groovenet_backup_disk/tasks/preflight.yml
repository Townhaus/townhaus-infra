---
- name: Validate Groovenet backup configuration
  ansible.builtin.assert:
    that:
      - groovenet_backup_disk_uuid is match('^[a-fA-F0-9-]+$')
      - groovenet_backup_disk_storage_mount == '/srv/storage'
      - groovenet_backup_disk_directory == 'groovenet-backup'
      - groovenet_backup_disk_mount == '/srv/groovenet-backup'
      - groovenet_backup_disk_restic_password_ref is match('^op://.+/.+/.+$')
    fail_msg: >-
      Set the existing storage disk UUID and local Restic password reference.
      This reuse-only role reserves /srv/storage/groovenet-backup and
      /srv/groovenet-backup; it never formats or takes ownership of /srv/storage.

- name: Inspect the existing storage mount
  ansible.builtin.command:
    argv:
      - findmnt
      - --mountpoint
      - "{{ groovenet_backup_disk_storage_mount }}"
      - --noheadings
      - --output
      - UUID,FSTYPE
  register: _groovenet_backup_disk_storage_mount
  changed_when: false
  check_mode: false

- name: Refuse an absent or unexpected storage disk
  ansible.builtin.assert:
    that:
      - _groovenet_backup_disk_storage_mount.stdout.split() == [groovenet_backup_disk_uuid, 'ext4']
    fail_msg: The expected ext4 storage disk must already be mounted; no fallback to the root disk is allowed.

- name: Read storage and parent device numbers
  ansible.builtin.command:
    argv: [stat, -c, "%d", /srv/storage, /srv]
  register: _groovenet_backup_disk_storage_devices
  changed_when: false
  check_mode: false

- name: Require storage to be on a separate device
  ansible.builtin.assert:
    that:
      - _groovenet_backup_disk_storage_devices.stdout_lines[0] != _groovenet_backup_disk_storage_devices.stdout_lines[1]

- name: Inspect any existing backup mount
  ansible.builtin.command:
    argv: [findmnt, --mountpoint, /srv/groovenet-backup, --noheadings, --output, "UUID,FSROOT"]
  register: _groovenet_backup_disk_existing_backup_mount
  changed_when: false
  failed_when: _groovenet_backup_disk_existing_backup_mount.rc not in [0, 1]
  check_mode: false

- name: Refuse to replace an unrelated mount
  ansible.builtin.assert:
    that:
      - >-
        _groovenet_backup_disk_existing_backup_mount.rc == 1 or
        _groovenet_backup_disk_existing_backup_mount.stdout.split() ==
        [groovenet_backup_disk_uuid, '/groovenet-backup']

- name: Read the existing deployment environment ownership
  ansible.builtin.stat:
    path: "{{ groovenet_app_dir }}/.env"
  register: _groovenet_backup_disk_env

- name: Require an existing Groovenet deployment
  ansible.builtin.assert:
    that:
      - _groovenet_backup_disk_env.stat.isreg | default(false)
    fail_msg: Deploy Groovenet first; this role does not create or deploy the stack.

- name: Inspect reserved backup paths without following symlinks
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - /srv/storage/groovenet-backup
    - /srv/groovenet-backup
  register: _groovenet_backup_disk_reserved_paths

- name: Require reserved paths to be absent or real directories
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isdir | default(false) and not item.stat.islnk | default(false))
  loop: "{{ _groovenet_backup_disk_reserved_paths.results }}"
  loop_control:
    label: "{{ item.item }}"
