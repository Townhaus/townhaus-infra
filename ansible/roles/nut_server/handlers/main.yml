---
- name: Reload systemd for NUT
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart NUT driver enumerator
  ansible.builtin.systemd_service:
    name: nut-driver-enumerator.service
    state: restarted
  when: not ansible_check_mode or 'nut-driver-enumerator.service' in ansible_facts['services']

- name: Restart NUT server
  ansible.builtin.systemd_service:
    name: nut-server.service
    state: restarted
  when: not ansible_check_mode or 'nut-server.service' in ansible_facts['services']
