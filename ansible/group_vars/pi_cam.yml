---
aswitch_app_dir: "{{ remote_home }}/aswitch"
recording_archive_enabled: true
recording_archive_destination: "{{ recording_archive_root }}/recordings/vinyl/pi-cam"

# Keep the DSP installation and presets available, but play directly to the ZD3.
camilladsp_enabled: false

aswitch_services:
  - name: audio_activity
    script: audio_activity.py
  - name: dac_status
    script: dac_status.py
  - name: amp_trigger
    script: amp_trigger.py

aswitch_services_source_files:
  - "{{ playbook_dir }}/../../services/aswitch/audio_activity.py"
  - "{{ playbook_dir }}/../../services/aswitch/groovenet_ingest.py"
  - "{{ playbook_dir }}/../../services/aswitch/live_audio.py"
  - "{{ playbook_dir }}/../../services/aswitch/dac_status.py"
  - "{{ playbook_dir }}/../../services/aswitch/amp_trigger.py"

aswitch_services_static_hosts:
  - address: 192.168.2.151
    name: groovenet.home.arpa
aswitch_services_caddy_ca_enabled: true

# 1Password secret references – resolved at deploy time with `op read`.
aswitch_mqtt_user_ref: op://Homelab/MQTT/username
aswitch_mqtt_pass_ref: op://Homelab/MQTT/password

aswitch_env_extra:
  AUDIO_DEVICE: "Scarlett 6i6 USB"
  AUDIO_CAPTURE_CHANNELS: "6"
  AUDIO_CHANNEL_MAP: "3,4"
  AUDIO_MQTT_TOPIC_PREFIX: pi-cam
  RECORDINGS_DIR: "{{ ansible_env.HOME }}/aswitch/recordings"
  RECORDING_ATTENUATION_DB: "-6.0"
  GROOVENET_INGEST_ENABLED: "true"
  GROOVENET_INGEST_URL: "https://groovenet.home.arpa/api/audio/ingest"
  GROOVENET_SOURCE_ID: pi-cam
  GROOVENET_CHUNK_SECONDS: "15"
  GROOVENET_SAMPLE_RATE: "44100"
  GROOVENET_SPOOL_DIR: "{{ ansible_env.HOME }}/aswitch/groovenet-spool"
  GROOVENET_INGEST_ONLY_WHEN_ACTIVE: "true"
  AUDIO_ACTIVITY_INACTIVE_HOLD_SECONDS: "30"
  DAC_USB_ID: "152a:889b"
  DAC_MATCH_TEXT: "Fosi Audio ZD3"
  DAC_POLL_INTERVAL_SECONDS: "5"
  DAC_STATE_TOPIC: aswitch/dac/zd3/state
  DAC_DETAILS_TOPIC: aswitch/dac/zd3/details
  DAC_AVAILABILITY_TOPIC: aswitch/dac/zd3/availability
  # Stop subscribing to the Home Assistant automation that starts CamillaDSP.
  DAC_COMMAND_TOPIC: "{{ 'aswitch/dac/zd3/command' if (camilladsp_enabled | bool) else '' }}"
  AMP_TRIGGER_GPIO: "27"
  AMP_TRIGGER_COMMAND_TOPIC: pi-cam/trigger
  AMP_TRIGGER_STATE_TOPIC: pi-cam/trigger/state
  AMP_TRIGGER_AVAILABILITY_TOPIC: pi-cam/availability

audio_room_name: lounge_room
airplay_display_name: Lounge Room Audio

shairport_name: "{{ airplay_display_name }}"
shairport_interpolation: auto
shairport_alsa_output: "{{ 'hw:Loopback,0,0' if (camilladsp_enabled | bool) else 'plughw:CARD=ZD3,DEV=0' }}"
shairport_alsa_output_rate: 44100
shairport_alsa_output_format: S32_LE
shairport_ignore_volume_control: "yes"
shairport_mqtt_topic: "pi-cam/shairport"
shairport_mqtt_client_id: shairport-living-room
shairport_mqtt_publish_parsed: "yes"
shairport_mqtt_publish_cover: "yes"
shairport_mqtt_enable_remote: "no"
shairport_systemd_after: >-
  {{ ['sound.target', 'camilladsp.service', 'network.target', 'nss-lookup.target']
     if (camilladsp_enabled | bool)
     else ['sound.target', 'network.target', 'nss-lookup.target'] }}
shairport_systemd_wants: "{{ ['camilladsp.service'] if (camilladsp_enabled | bool) else [] }}"

camilladsp_capture_device: "hw:Loopback,1"
camilladsp_playback_device: "plughw:CARD=ZD3,DEV=0"
camilladsp_playback_card_name: ZD3
camilladsp_udev_usb_id: "152a:889b"
camilladsp_mqtt_control_enabled: true
audio_keep_output_open: true
audio_pop_mitigation_enabled: true
