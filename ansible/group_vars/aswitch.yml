---
aswitch_app_dir: "{{ remote_home }}/aswitch"

dotfiles_enabled: true
dotfiles_manage_packages: false
dotfiles_set_default_shell: false
dotfiles_stow_packages:
  - zsh
  - git
  - npm
  - starship
  - ghostty
  - zed
  - tools
  - ssh
  - claude
dotfiles_unstow_packages:
  - bash

aswitch_services:
  - name: audio_activity
    script: audio_activity.py
  - name: ir_logger
    script: ir_logger.py
    after:
      - pigpiod.service
    wants:
      - pigpiod.service
  - name: preamp_trigger
    script: preamp_trigger.py
    after:
      - pigpiod.service
    wants:
      - pigpiod.service
  - name: preamp_led
    script: preamp_led.py

# Leave the CamillaDSP installation and presets intact, but do not run it on
# aswitch. Set this to true and deploy to restore the services.
camilladsp_enabled: false

aswitch_services_disabled_services:
  - aswitch

# aswitch uses the router for DNS, which does not resolve AdGuard's local
# rewrites. Keep the Groovenet hostname for Caddy's TLS certificate while
# routing it directly to the Caddy host.
aswitch_services_static_hosts:
  - address: 192.168.2.151
    name: groovenet.home.arpa
aswitch_services_static_hosts_persist_cloud_init: true

# Trust Caddy's internal CA so the Groovenet uploader can verify its HTTPS
# certificate while using the static mapping above.
aswitch_services_caddy_ca_enabled: true

# 1Password secret references – resolved at deploy time with `op read`.
# Create these items in 1Password before running the playbook.
aswitch_mqtt_user_ref: op://Homelab/MQTT/username
aswitch_mqtt_pass_ref: op://Homelab/MQTT/password

aswitch_env_extra:
  AUDIO_DEVICE: "plughw:CARD=CODEC,DEV=0"
  RECORDINGS_DIR: "{{ ansible_env.HOME }}/aswitch/recordings"
  RECORDING_ATTENUATION_DB: "-6.0"
  # Requires Groovenet v0.2.2 or later, which provides /api/audio/ingest.
  GROOVENET_INGEST_ENABLED: "true"
  GROOVENET_INGEST_URL: "https://groovenet.home.arpa/api/audio/ingest"
  GROOVENET_SOURCE_ID: aswitch
  GROOVENET_CHUNK_SECONDS: "15"
  GROOVENET_SAMPLE_RATE: "44100"
  GROOVENET_SPOOL_DIR: "{{ ansible_env.HOME }}/aswitch/groovenet-spool"
  GROOVENET_INGEST_ONLY_WHEN_ACTIVE: "true"
  AUDIO_ACTIVITY_INACTIVE_HOLD_SECONDS: "30"
  IR_GPIO: "17"
  IR_TX_GPIO: "18"
  IR_FRAME_GAP_US: "15000"
  IR_GLITCH_FILTER_US: "100"
  IR_TOPIC_RECEIVED: "aswitch/ir/received"
  IR_TOPIC_AVAILABILITY: "aswitch/ir/availability"
  IR_TOPIC_SEND: "aswitch/ir/send"
  IR_TOPIC_SENT: "aswitch/ir/sent"
  IR_TX_FREQUENCY_HZ: "38000"
  IR_TX_REPEAT_COUNT: "1"
  PREAMP_TRIGGER_GPIO: "23"
  PREAMP_TRIGGER_GLITCH_FILTER_US: "20000"
  PREAMP_TRIGGER_STATE_TOPIC: aswitch/preamp/trigger/state
  PREAMP_TRIGGER_AVAILABILITY_TOPIC: aswitch/preamp/trigger/availability
  TCS34725_I2C_BUS: "1"
  TCS34725_I2C_ADDRESS: "0x29"
  TCS34725_INTEGRATION_TIME: "0xD6"
  TCS34725_GAIN: "0x01"
  PREAMP_LED_SAMPLE_INTERVAL_SECONDS: "1"
  PREAMP_LED_OFF_CLEAR_THRESHOLD: "10"
  PREAMP_LED_COLOR_DOMINANCE_RATIO: "1.5"
  PREAMP_INPUT_BLUE_STATE: input_1
  PREAMP_INPUT_RED_STATE: input_2
  PREAMP_LED_STATE_TOPIC: aswitch/preamp/led/state
  PREAMP_INPUT_STATE_TOPIC: aswitch/preamp/input/state
  PREAMP_LED_RGB_TOPIC: aswitch/preamp/led/rgb
  PREAMP_LED_AVAILABILITY_TOPIC: aswitch/preamp/led/availability

shairport_name: aswitch
# Let Shairport choose interpolation on the Pi 3 instead of forcing soxr.
shairport_interpolation: auto
# CamillaDSP consumes the loopback only when enabled. Otherwise Shairport sends
# AirPlay to the UCA202, which forwards it digitally over TOSLINK to the SMSL.
shairport_alsa_output: "{{ 'hw:Loopback,0,0' if (camilladsp_enabled | bool) else 'plughw:CARD=CODEC,DEV=0' }}"
# The UCA202's digital output supports 16-bit 44.1/48 kHz. Pin AirPlay to its
# native rate and a universally supported sample format.
shairport_alsa_output_rate: 44100
shairport_alsa_output_format: S16_LE
shairport_mqtt_topic: aswitch/shairport
shairport_mqtt_publish_parsed: "yes"
shairport_mqtt_publish_cover: "yes"
# The SMSL has fixed output. Keep the preamp as the master volume and cap
# AirPlay at a level that matches the mixer when the source is at full volume.
shairport_ignore_volume_control: "no"
shairport_volume_max_db: -12.0
# Keep Shairport from starting CamillaDSP as a systemd dependency while the
# latter is disabled. The normal dependency returns when camilladsp_enabled is
# set to true.
shairport_systemd_after: "{{ ['network-online.target', 'camilladsp.service'] if (camilladsp_enabled | bool) else ['network-online.target'] }}"
shairport_systemd_wants: "{{ ['camilladsp.service'] if (camilladsp_enabled | bool) else [] }}"

camilladsp_capture_device: "hw:Loopback,1"
camilladsp_playback_device: "plughw:CARD=AUDIO,DEV=0"
camilladsp_playback_card_name: AUDIO
