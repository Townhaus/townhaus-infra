---
- name: Deploy pi-cam.local services
  hosts: pi_cam
  gather_facts: true

  pre_tasks:
    - name: Guard bash startup for non-interactive Ansible sessions
      ansible.builtin.blockinfile:
        path: "{{ remote_home }}/.bashrc"
        create: true
        mode: "0644"
        insertbefore: BOF
        marker: "# {mark} ANSIBLE NONINTERACTIVE BASH GUARD"
        block: |
          case $- in
            *i*) ;;
            *) return ;;
          esac

    - name: Verify 1Password CLI is available
      ansible.builtin.command:
        argv: [op, --version]
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: inventory_hostname == ansible_play_hosts_all[0]
      changed_when: false

  roles:
    - role: motd
    - role: pi_wifi
    - role: alloy
      vars:
        # pi-cam currently uses the router for DNS, which does not resolve
        # the AdGuard-managed loki.home.arpa rewrite.
        alloy_loki_url: http://192.168.2.151:3100/loki/api/v1/push
    - role: shairport
    - role: camilladsp
    - role: aswitch_services
    - role: beszel_agent
    - role: package_update_report
    - role: dotfiles
