---
- name: Deploy Shairport Sync on aswitch only
  hosts: aswitch
  gather_facts: true

  pre_tasks:
    - name: Verify 1Password CLI is available
      ansible.builtin.command:
        argv: [op, --version]
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      changed_when: false
      check_mode: false

  roles:
    - role: shairport
