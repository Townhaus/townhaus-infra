---
- name: Configure beelink.local – AdGuard DNS and Beszel agent
  hosts: townhaus_caddy
  gather_facts: true

  pre_tasks:
    - name: Guard bash startup for non-interactive Ansible sessions
      ansible.builtin.blockinfile:
        path: "{{ remote_home }}/.bashrc"
        create: true
        mode: "0644"
        insertbefore: BOF
        marker: "# {mark} ANSIBLE NONINTERACTIVE BASH GUARD"
        block: |
          case $- in
            *i*) ;;
            *) return ;;
          esac

    - name: Verify 1Password CLI is available
      ansible.builtin.command:
        argv: [op, --version]
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: inventory_hostname == ansible_play_hosts_all[0]
      changed_when: false

  roles:
    - role: motd
    - role: alloy
      vars:
        alloy_collect_docker: true
    - role: beszel_hub
    - role: adguard_dns
    - role: beszel_agent
    - role: package_update_report
    - role: frigate
    - role: uptime_kuma
    - role: immich_backup
    - role: nfs_server
    - role: dotfiles

# Run the existing Docker stack playbook separately:
#   ansible-playbook ansible/deploy.yml -i ansible/inventory.ini
