[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "LOG", # flake8-logging
    "G",   # flake8-logging-format
]
ignore = [
    "B008",  # function calls in default arguments
]

[tool.ruff.lint.isort]
known-first-party = ["amp_trigger", "aswitch", "audio_activity", "dac_status", "groovenet_ingest", "ir_logger", "live_audio", "preamp_ir_codes", "recording_archive"]
