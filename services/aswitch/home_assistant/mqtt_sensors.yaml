mqtt:
  switch:
    - name: "Amp Power"
      unique_id: aswitch_amp_power
      command_topic: "pi-cam/trigger"
      state_topic: "pi-cam/trigger/state"
      payload_on: "on"
      payload_off: "off"

    - name: "Audio Source DAC"
      unique_id: aswitch_audio_source_dac
      command_topic: "aswitch/audio"
      state_topic: "aswitch/audio/state"
      payload_on: "dac"
      payload_off: "mixer"

    - name: "Mixer Recording"
      unique_id: "aswitch_mixer_recording"
      command_topic: "aswitch/audio_recording/set"
      state_topic: "aswitch/audio_recording/state"
      payload_on: "on"
      payload_off: "off"

  binary_sensor:
    - name: "Preamp Power"
      unique_id: "aswitch_preamp_power"
      state_topic: "aswitch/preamp/trigger/state"
      payload_on: "on"
      payload_off: "off"
      availability_topic: "aswitch/preamp/trigger/availability"
      payload_available: "online"
      payload_not_available: "offline"
      device_class: power

    - name: "Mixer Audio Activity"
      unique_id: "aswitch_mixer_audio_activity"
      state_topic: "aswitch/audio_activity/state"
      payload_on: "active"
      payload_off: "inactive"
      device_class: sound

    - name: "Fosi ZD3 Status"
      unique_id: "fosi_zd3_status"
      state_topic: "aswitch/dac/zd3/state"
      payload_on: "connected"
      payload_off: "disconnected"
      availability_topic: "aswitch/dac/zd3/availability"
      payload_available: "online"
      payload_not_available: "offline"
      device_class: connectivity
      icon: "mdi:usb-port"

  sensor:
    - name: "Mixer Recording Archive"
      unique_id: "aswitch_mixer_recording_archive"
      state_topic: "aswitch/audio_recording/archive"
      value_template: "{{ value_json.state }}"
      json_attributes_topic: "aswitch/audio_recording/archive"
      icon: "mdi:folder-music"

    - name: "Preamp LED"
      unique_id: "aswitch_preamp_led"
      state_topic: "aswitch/preamp/led/state"
      availability_topic: "aswitch/preamp/led/availability"
      payload_available: "online"
      payload_not_available: "offline"
      icon: "mdi:led-on"

    - name: "Preamp Input"
      unique_id: "aswitch_preamp_input"
      state_topic: "aswitch/preamp/input/state"
      availability_topic: "aswitch/preamp/led/availability"
      payload_available: "online"
      payload_not_available: "offline"
      icon: "mdi:audio-input-stereo-minijack"
