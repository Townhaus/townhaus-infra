services:
  frigate:
    # Pin the production release and manifest; upgrade deliberately after reviewing release notes.
    image: ghcr.io/blakeblackshear/frigate:0.18.2@sha256:fd60f99ffd4eb6c42360ed4e14953e270586f239309ab3983e55b2e97ffac09a
    container_name: frigate
    restart: unless-stopped
    privileged: true
    shm_size: "256mb"

    # Load deployment-specific values from .env (MQTT, TZ, UID/GID, etc).
    env_file:
      - .env

    # HomeKit via go2rtc relies on local discovery; host mode is the simplest path.
    network_mode: host

    # Device pass-through for Intel VAAPI decode/encode.
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128

    # Use host localtime for aligned timestamps in logs/events.
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/storage/frigate-config:/config
      - /srv/storage/frigate:/media/frigate

    # tmpfs cache avoids unnecessary disk writes for ephemeral cache data.
    tmpfs:
      - /tmp/cache:size=1g,mode=1777

    # Optional hardening and predictable shutdown behavior.
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
